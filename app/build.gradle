plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vagiiark.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vagiiark.tv'
        minSdk 26
        targetSdk 34
        versionCode 171
        versionName '1.7.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
