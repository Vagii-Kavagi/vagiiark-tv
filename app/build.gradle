plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.twoarchiver.ytark'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.twoarchiver.ytark'
        minSdk 26
        targetSdk 34
        versionCode 100
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
